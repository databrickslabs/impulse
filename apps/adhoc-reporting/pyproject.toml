[project]
name = "impulse-app"
version = "4.0.0.dev0"
description = "Databricks App for building Impulse reports with a guided UI and chat"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "databricks-sdk>=0.70",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Without its own [tool.uv] table, uv applies the impulse repo's root [tool.uv] settings to the app.
[tool.uv]
