# Bundle for the end-to-end tests: one serverless job that runs tests/e2e.
bundle:
  name: impulse-e2e

artifacts:
  impulse_wheel:
    type: whl
    # Clean first so the dist/*.whl glob in resources/e2e_job.yml matches one wheel.
    build: rm -rf dist && uv build --wheel
    path: .

include:
  - resources/*.yml

variables:
  catalog:
    description: Catalog for the ephemeral test schemas.
    default: maxim_catalog
  source_schema:
    description: Schema under `catalog` with the silver test data (read-only).
    default: default

targets:
  # Workspace host and auth come from the environment.
  e2e:
    default: true
    mode: development
