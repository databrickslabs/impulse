name: e2e

# End-to-end tests on Databricks serverless (see databricks.yml). Nightly and on demand.
on:
  schedule:
    # 04:00 UTC daily.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# All runs deploy to the same bundle and job, so they queue instead of cancelling each
# other (cancelling would stop only the CLI, not the job run).
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  e2e:
    name: E2E on Databricks (serverless)
    runs-on:
      group: databrickslabs-protected-runner-group
      labels: linux-ubuntu-latest
    environment: e2e
    permissions:
      # For JFrog OIDC.
      id-token: write
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_AUTH_TYPE: oauth-m2m
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install UV
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098 # v7.3.1
        with:
          enable-cache: false
          version: "0.11.2"
          checksum: "7ac2ca0449c8d68dae9b99e635cd3bc9b22a4cb1de64b7c43716398447d42981"

      - name: Setup for JFrog
        uses: ./.github/actions/jfrog-auth

      - name: Install dependencies
        run: make dev

      - name: Install Databricks CLI
        uses: databricks/setup-cli@8821c27b1fe57472264eeb6e50c1f31d69552f28 # v1.10.0

      # Also builds the wheel.
      - name: Deploy bundle
        run: databricks bundle deploy -t e2e

      - name: Run e2e job
        run: databricks bundle run e2e_tests -t e2e

      # A cancelled workflow leaves the job run going; stop it too.
      - name: Cancel e2e job run
        if: cancelled()
        run: |
          job_id=$(databricks bundle summary -t e2e -o json | jq -r '.resources.jobs.e2e_tests.id')
          databricks jobs cancel-all-runs --job-id "$job_id"
