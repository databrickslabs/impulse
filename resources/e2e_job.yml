resources:
  jobs:
    e2e_tests:
      name: "impulse e2e tests"
      timeout_seconds: 3600
      max_concurrent_runs: 1

      tasks:
        - task_key: run_e2e
          spark_python_task:
            python_file: ../tests/e2e/run_in_job.py
            parameters:
              - "--catalog"
              - ${var.catalog}
              - "--source-schema"
              - ${var.source_schema}
              - "--repo-root"
              - ${workspace.file_path}
          environment_key: e2e_env

      environments:
        - environment_key: e2e_env
          spec:
            # pyspark and delta come with the serverless environment.
            environment_version: "5"
            dependencies:
              - ../dist/*.whl
              - databricks-labs-pytester==0.7.4
