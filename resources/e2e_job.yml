resources:
  jobs:
    e2e_tests:
      name: "impulse e2e tests"
      timeout_seconds: 3600
      max_concurrent_runs: 1

      tasks:
        - task_key: setup
          environment_key: e2e_env
          disable_auto_optimization: true
          notebook_task:
            notebook_path: ../tests/e2e/setup_schema.py
            base_parameters: &params
              catalog: ${var.catalog}
              schema: e2e_{{job.run_id}}
              source_schema: ${var.source_schema}
              # Each test writes its tables with this prefix and reads expected/<prefix>/.
              prefix: "{{task.name}}"
              expected_dir: ${workspace.file_path}/tests/e2e/expected
              actual_dir: ${workspace.root_path}/actual

        # The tests run in parallel.
        - task_key: rpm_histogram
          environment_key: e2e_env
          disable_auto_optimization: true
          depends_on: [{task_key: setup}]
          notebook_task: {notebook_path: ../tests/e2e/e2e_rpm_histogram.py, base_parameters: *params}

        - task_key: incremental
          environment_key: e2e_env
          disable_auto_optimization: true
          depends_on: [{task_key: setup}]
          notebook_task: {notebook_path: ../tests/e2e/e2e_incremental.py, base_parameters: *params}

        - task_key: pipeline
          environment_key: e2e_env
          disable_auto_optimization: true
          depends_on: [{task_key: setup}]
          notebook_task: {notebook_path: ../tests/e2e/e2e_pipeline.py, base_parameters: *params}

        - task_key: container_filter
          environment_key: e2e_env
          disable_auto_optimization: true
          depends_on: [{task_key: setup}]
          notebook_task: {notebook_path: ../tests/e2e/e2e_container_filter.py, base_parameters: *params}

        # Runs only when all tests passed.
        - task_key: teardown
          environment_key: e2e_env
          disable_auto_optimization: true
          depends_on:
            - {task_key: rpm_histogram}
            - {task_key: incremental}
            - {task_key: pipeline}
            - {task_key: container_filter}
          notebook_task: {notebook_path: ../tests/e2e/teardown.py, base_parameters: *params}

        # Fails the run when setup or a test failed.
        - task_key: fail_on_error
          environment_key: e2e_env
          disable_auto_optimization: true
          depends_on: [{task_key: setup}, {task_key: rpm_histogram}, {task_key: incremental}, {task_key: pipeline}, {task_key: container_filter}]
          run_if: AT_LEAST_ONE_FAILED
          notebook_task: {notebook_path: ../tests/e2e/fail_on_error.py}

      environments:
        - environment_key: e2e_env
          spec:
            # pyspark and delta come with the serverless environment.
            environment_version: "5"
            dependencies:
              - ../dist/*.whl
